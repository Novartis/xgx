name: Build site

# Renders the xGx website from source on every push, so that no build output
# ever needs to be committed to the repository.
#
# Deployment is currently DISABLED. GitHub Pages for this repo is still set to
# "Deploy from a branch" (master, /), so the live site continues to be served
# from the committed HTML in the repository root exactly as before. This
# workflow only builds and uploads the result as a downloadable artifact, so
# the pipeline can be proven before anything about the live site changes.
#
# To go live, an org admin changes Settings > Pages > Source to "GitHub
# Actions", and the `deploy` job below is enabled. See
# design/2026-08-06_CI_Build_Pipeline.md.

on:
  push:
    branches: [master, andy-reorg-nochange]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A full render compiles ODE models and ~27 pages from scratch.
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # Posit's package manager serves prebuilt Ubuntu binaries, which
          # turns a ~40 minute source build of the tidyverse into a few minutes.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Read from the DESCRIPTION at the repository root, which is the one
          # authoritative record of what the site needs.
          #
          # "hard" means Depends/Imports/LinkingTo only, deliberately excluding
          # Suggests. rxode2 lives in Suggests because it is needed only to
          # regenerate the datasets in Data/, which are committed. It requires C
          # and Fortran compilers and links against RcppArmadillo, BH and
          # StanHeaders, so keeping it out of the build is what makes this
          # pipeline dependency-light.
          dependencies: '"hard"'

      # knitr caches make a re-render minutes rather than an hour. Each CI run
      # starts on a clean machine, so the caches have to be carried across runs
      # explicitly. Keyed on the .Rmd contents so a source edit invalidates it.
      - name: Restore knitr cache
        uses: actions/cache@v4
        with:
          path: Rmarkdown/*_cache
          key: knitr-${{ runner.os }}-${{ hashFiles('Rmarkdown/*.Rmd') }}
          restore-keys: |
            knitr-${{ runner.os }}-

      # The first full render was killed abruptly mid-page with no R error,
      # which is what an out-of-memory kill looks like from inside Actions.
      # Sample resources to a file so the evidence survives the step dying.
      - name: Start resource sampler
        run: |
          nohup bash -c 'while true; do
            echo "$(date +%T) used_mb=$(free -m | awk "/^Mem:/{print \$3}")" \
                 "avail_mb=$(free -m | awk "/^Mem:/{print \$7}")" \
                 "disk_avail=$(df -m / | awk "NR==2{print \$4}")MB"
            sleep 5
          done' > /tmp/resources.log 2>&1 &
          disown
          echo "sampler started"

      - name: Render site
        run: Rscript dev/ci/render_site_ci.R

      # `always()` so this reports even when the render step is killed.
      - name: Resource report
        if: always()
        run: |
          echo "=== peak memory used ==="
          grep -o 'used_mb=[0-9]*' /tmp/resources.log | cut -d= -f2 \
            | sort -n | tail -3
          echo "=== lowest memory available ==="
          grep -o 'avail_mb=[0-9]*' /tmp/resources.log | cut -d= -f2 \
            | sort -n | head -3
          echo "=== final 12 samples ==="
          tail -12 /tmp/resources.log

      - name: Check links
        run: python3 dev/ci/check_links.py Rmarkdown/www

      # Lets you download the built site from the run summary and open it
      # locally, without touching the live site.
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: xgx-site
          path: Rmarkdown/www
          retention-days: 14

      # Only in a fork. On Novartis/xgx this step is skipped, so nothing is
      # ever staged for deployment there.
      - name: Upload Pages artifact
        if: github.repository_owner != 'Novartis'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Rmarkdown/www

  # Publishes the CI-built site so it can actually be clicked through.
  #
  # Deliberately scoped to forks: on Novartis/xgx this job never runs, so the
  # live site at opensource.nibr.com/xgx keeps being served from the committed
  # HTML on master exactly as before. In a personal fork it publishes to that
  # fork's own Pages, e.g. https://iamstein.github.io/xgx/ -- the same /xgx/
  # path depth as production, so relative links behave identically.
  #
  # At cutover this condition becomes `github.ref == 'refs/heads/master'`.
  deploy:
    if: github.repository_owner != 'Novartis'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
